<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApplyCompanion</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
        <span>ApplyCompanion</span>
      </div>
    </header>

    <!-- Initial state -->
    <div id="view-idle" class="view">
      <p class="hint">Navigate to a job posting, then scan the page to extract the job description.</p>
      <button id="btn-scan" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Scan Job Description
      </button>
    </div>

    <!-- Loading state -->
    <div id="view-loading" class="view hidden">
      <div class="spinner"></div>
      <p class="hint">Reading page...</p>
    </div>

    <!-- Review state -->
    <div id="view-review" class="view hidden">
      <div class="field-group">
        <label for="field-company">Company</label>
        <input id="field-company" type="text" placeholder="Company name" />
      </div>
      <div class="field-group">
        <label for="field-title">Role</label>
        <input id="field-title" type="text" placeholder="Job title" />
      </div>
      <div class="field-group">
        <label for="field-desc">Job Description</label>
        <textarea id="field-desc" rows="10" placeholder="Job description will appear here..."></textarea>
      </div>
      <div class="field-group">
        <label for="field-url">URL</label>
        <input id="field-url" type="text" readonly />
      </div>
      <div class="actions">
        <button id="btn-rescan" class="btn btn-secondary">Re-scan</button>
        <button id="btn-send" class="btn btn-primary">Send to App</button>
      </div>
    </div>

    <!-- Sending state -->
    <div id="view-sending" class="view hidden">
      <div class="spinner"></div>
      <p class="hint">Sending to companion app...</p>
    </div>

    <!-- Success state -->
    <div id="view-success" class="view hidden">
      <div class="success-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <p class="success-msg">Job captured!</p>
      <p class="hint" id="success-company"></p>
      <button id="btn-open-app" class="btn btn-primary">Open in App</button>
      <button id="btn-new" class="btn btn-secondary">Scan Another</button>
    </div>

    <!-- Error state -->
    <div id="view-error" class="view hidden">
      <div class="error-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      </div>
      <p class="error-msg" id="error-text">Something went wrong.</p>
      <button id="btn-retry" class="btn btn-secondary">Try Again</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
